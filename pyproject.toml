[project]
name = "seoaudit"
version = "1.0.0"
description = "Crawl a website and audit on-page SEO: titles, meta descriptions, headings, broken links, image alt text. HTML/JSON/CSV reports."
authors = [{ name = "Joseph Obaje", email = "josephobaje264@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12", "lxml>=5.0"]

[project.scripts]
seoaudit = "seoaudit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
